name: International static analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install static analysis dependencies
        run: python3 -m pip install capstone==5.0.6 keystone-engine==0.9.2
      - name: Download encrypted inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_PASSPHRASE: ${{ secrets.INPUTS_PASSPHRASE }}
        run: |
          mkdir inputs
          gh release download ci-inputs --pattern inputs.enc --dir inputs
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:INPUTS_PASSPHRASE -in inputs/inputs.enc -out inputs/inputs.tar
          tar -xf inputs/inputs.tar -C inputs
      - name: Recover international layout
        run: python3 tools/discover_wildrift.py
      - name: Upload selected analysis only
        uses: actions/upload-artifact@v4
        with:
          name: international-analysis
          path: |
            build/international-layout.json
            build/international-selected.asm
      - name: Remove private inputs
        if: always()
        run: rm -rf inputs
