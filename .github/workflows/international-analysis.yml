name: International static analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install static analysis dependencies
        run: python3 -m pip install capstone==5.0.6 keystone-engine==0.9.2 unicorn==2.1.4
      - name: Download encrypted inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_PASSPHRASE: ${{ secrets.INPUTS_PASSPHRASE }}
        run: |
          mkdir inputs
          gh release download ci-inputs --pattern inputs.enc --dir inputs
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:INPUTS_PASSPHRASE -in inputs/inputs.enc -out inputs/inputs.tar
          tar -xf inputs/inputs.tar -C inputs
      - name: Recover international layout
        run: python3 tools/discover_wildrift.py
      - name: Inspect selected skill-slot getters
        run: |
          python3 tools/inspect_skill_cooldown.py
          python3 tools/inspect_summoner_cooldown.py
          python3 tools/inspect_runtime_features.py
      - name: Validate original international native engine getters
        env:
          LVLOLM_IOS_ENGINE: inputs/FEProj
        run: python3 tests/test_native_engine_getters.py
      - name: Validate skill panel boundaries
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVSkillPanel.c tests/skill_panel_test.c -o build/skill_panel_test
          build/skill_panel_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMonsterRespawn.c tests/monster_respawn_test.c -o build/monster_respawn_test
          build/monster_respawn_test
      - name: Upload selected analysis only
        uses: actions/upload-artifact@v4
        with:
          name: international-analysis
          path: |
            build/international-layout.json
            build/international-selected.asm
            build/skill-panel-getters.asm
            build/skill-panel-methods.json
            build/skill-panel-classification.asm
            build/skill-cooldown-accessors.asm
            build/skill-cooldown-consumers.asm
            build/summoner-cooldown.asm
            build/summoner-labels.json
            build/runtime-feature-layouts.json
            build/spell-label-initializers.asm
            build/international-spell-ids.json
            build/monster-anchor-layouts.json
            build/monster-timer-consumers.asm
            build/monster-anchor-roots.json
            build/monster-anchor-roots.asm
            build/monster-group-references.json
            build/monster-timer-enums.json
            build/anchor-position-components.asm
      - name: Remove private inputs
        if: always()
        run: rm -rf inputs
