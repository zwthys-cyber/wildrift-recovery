name: Build TrollStore IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional prerelease tag to publish after every check passes'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Load private international inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_PASSPHRASE: ${{ secrets.INPUTS_PASSPHRASE }}
        run: |
          mkdir -p inputs
          gh release download ci-inputs --pattern inputs.enc --dir inputs
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:INPUTS_PASSPHRASE -in inputs/inputs.enc -out inputs/inputs.tar
          tar -xf inputs/inputs.tar -C inputs
      - name: Validate international original instructions and exact layout
        env:
          LVLOLM_IOS_FRAMEWORK: inputs/UnityFramework
          LVLOLM_IOS_METADATA: inputs/global-metadata.dat
          LVLOLM_IOS_ENGINE: inputs/FEProj
        run: |
          python3 -m pip install capstone==5.0.6 unicorn==2.1.4
          python3 tests/test_international_profile.py
          python3 tests/test_ios_metadata_equivalence.py
          python3 tests/test_ios_getters_equivalence.py
          python3 tests/test_native_engine_getters.py
          python3 tests/test_ios_minimap_projection.py
      - name: Prepare pinned SDK and signing tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 gcc
          python3 scripts/fetch_toolchain.py
      - name: Build ARM64 IPA
        run: python3 scripts/build_ios.py --clang clang-18 --linker ld64.lld-18
      - name: Validate readers, minimap, health rings, motion and IPA signatures
        shell: bash
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/minimap_test.c -lm -o build/minimap_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimapMotion.c tests/minimap_motion_test.c -lm -o build/minimap_motion_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/ward_minimap_test.c -lm -o build/ward_minimap_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVTarget.c tests/target_test.c -lm -o build/target_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVTarget.c tests/native_health_test.c -lm -o build/native_health_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVLogicPosition.c core/LVMinimap.c tests/logic_position_test.c -lm -o build/logic_position_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/minimap_health_test.c -lm -o build/minimap_health_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVHUDTelemetry.c tests/hud_telemetry_test.c -o build/hud_telemetry_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/monster_minimap_test.c -lm -o build/monster_minimap_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVSkillPanel.c tests/skill_panel_test.c -o build/skill_panel_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVActions.c core/LVConfig.c core/LVSmitePreview.c tests/smite_preview_test.c -lm -o build/smite_preview_test
          build/smite_preview_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMonsterRespawn.c tests/monster_respawn_test.c -o build/monster_respawn_test
          build/monster_respawn_test | tee build/monster-respawn-checks.txt
          build/skill_panel_test | tee build/skill-panel-checks.txt
          build/monster_minimap_test | tee build/monster-minimap-checks.txt
          build/minimap_test | tee build/minimap-checks.txt
          build/minimap_motion_test | tee build/minimap-motion-checks.txt
          build/ward_minimap_test | tee build/ward-minimap-checks.txt
          build/target_test | tee build/target-reader-checks.txt
          build/native_health_test | tee build/native-health-checks.txt
          build/logic_position_test | tee build/logic-position-checks.txt
          build/minimap_health_test | tee build/minimap-health-checks.txt
          build/hud_telemetry_test | tee build/hud-telemetry-checks.txt
          python3 tests/test_ipa.py
          python3 tests/test_zip.py
          python3 tests/test_collection_inspector.py
          python3 tests/test_device_minimap_check.py
      - name: Record CI provenance and package source
        run: |
          python3 scripts/record_ci_validation.py
          python3 scripts/package_source.py
          sha256sum dist/*.ipa dist/*source*.zip > dist/SHA256SUMS.txt
      - name: Upload build and validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wildrift-international-2813
          path: dist/
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo 'Invalid release tag'; exit 1
          fi
          release_flags=()
          if [[ "$release_tag" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$release_tag" dist/*.ipa dist/*source*.zip dist/SHA256SUMS.txt dist/build-metadata-*.json dist/ci-validation-*.json --target "$GITHUB_SHA" --title "Wild Rift 国际服 $release_tag" --notes-file .github/release-notes.md "${release_flags[@]}"
      - name: Remove private input copies
        if: always()
        run: rm -rf inputs
