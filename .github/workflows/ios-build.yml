name: Build TrollStore IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned SDK and signing tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 gcc
          python3 scripts/fetch_toolchain.py
      - name: Build ARM64 IPA
        run: python3 scripts/build_ios.py --clang clang-18 --linker ld64.lld-18
      - name: Validate readers, minimap, health rings, motion and IPA signatures
        shell: bash
        run: |
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/minimap_test.c -lm -o build/minimap_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimapMotion.c tests/minimap_motion_test.c -lm -o build/minimap_motion_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/ward_minimap_test.c -lm -o build/ward_minimap_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVTarget.c tests/target_test.c -lm -o build/target_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVTarget.c tests/native_health_test.c -lm -o build/native_health_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVLogicPosition.c core/LVMinimap.c tests/logic_position_test.c -lm -o build/logic_position_test
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVMinimap.c tests/minimap_health_test.c -lm -o build/minimap_health_test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -g -Icore core/LVHUDTelemetry.c tests/hud_telemetry_test.c -o build/hud_telemetry_test
          build/minimap_test | tee build/minimap-checks.txt
          build/minimap_motion_test | tee build/minimap-motion-checks.txt
          build/ward_minimap_test | tee build/ward-minimap-checks.txt
          build/target_test | tee build/target-reader-checks.txt
          build/native_health_test | tee build/native-health-checks.txt
          build/logic_position_test | tee build/logic-position-checks.txt
          build/minimap_health_test | tee build/minimap-health-checks.txt
          build/hud_telemetry_test | tee build/hud-telemetry-checks.txt
          python3 tests/test_ipa.py
          python3 tests/test_zip.py
          python3 tests/test_collection_inspector.py
          python3 tests/test_device_minimap_check.py
      - name: Record CI provenance and package source
        run: |
          python3 scripts/record_ci_validation.py
          python3 scripts/package_source.py
          sha256sum dist/*.ipa dist/*source*.zip > dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.ipa dist/*source*.zip dist/SHA256SUMS.txt dist/build-metadata-*.json dist/ci-validation-*.json --verify-tag --title "lvlolm $GITHUB_REF_NAME" --notes-file .github/release-notes.md "${release_flags[@]}"
